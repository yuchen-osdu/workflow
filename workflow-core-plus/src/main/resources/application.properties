#server config
server.servlet.contextPath=/api/workflow
server.port=8080

#log config
logging.level.org.springframework.web=${LOG_LEVEL:INFO}

#workflow service config
osdu.entitlements.app-key=workflow-service
# Airflow engine selection: airflow2 (default) or airflow3. Legacy osdu.airflow.version2
# is still honoured when osdu.airflow.version is unset.
osdu.airflow.version=${OSDU_AIRFLOW_VERSION:airflow2}
osdu.airflow.version2=true

datastore.conf.workflow-kind=workflow_osm
datastore.conf.workflow-run-kind=workflow_run_osm
datastore.conf.shared-tenant-name=${SHARED_TENANT_NAME}
datastore.conf.system-workflow-namespace=${SYSTEM_WORKFLOW_NAMESPACE:system_workflow_namespace}
#currently system kind not used due to misimplementation see https://jiraeu.epam.com/browse/GONRG-4385
datastore.conf.system-workflow-kind=system_workflow_osm

osdu.version.info.gitPropertiesPath=/git.properties

gcp.status.changed.messaging.enabled=true
gcp.status.changed.topic-name=status-changed
propertyResolver.strategy=partition

PARTITION_HOST=http://partition
PARTITION_PATH=/api/partition/v1
PARTITION_API=${PARTITION_HOST}${PARTITION_PATH}

osdu.entitlements.url= ${AUTHORIZE_API}
ENTITLEMENTS_HOST=http://entitlements
ENTITLEMENTS_PATH=/api/entitlements/v2
AUTHORIZE_API=${ENTITLEMENTS_HOST}${ENTITLEMENTS_PATH}

SECRET_HOST=http://secret
SECRET_PATH=/api/secret/v2
SECRET_API=${SECRET_HOST}${SECRET_PATH}

domain=${GROUP_ID:group}

osdu.airflow.url=${OSDU_AIRFLOW_URL}

# Airflow 3 backend (side-by-side host). Active only when osdu.airflow.version=airflow3.
# When set, in-flight Airflow 2 runs keep resolving on osdu.airflow.url while new runs go here.
osdu.airflow.airflow3.url=${OSDU_AIRFLOW_AIRFLOW3_URL:}
osdu.airflow.airflow3.username=${OSDU_AIRFLOW_AIRFLOW3_USERNAME:}
osdu.airflow.airflow3.password=${OSDU_AIRFLOW_AIRFLOW3_PASSWORD:}

spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

#Health checks
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.base-path=${MANAGEMENT_ENDPOINTS_WEB_BASE:/}
management.endpoints.web.exposure.include=health
management.health.probes.enabled=true

# External/Airflow-3 (JwtAuth) config https guard, from the upstream External Airflow feature
# (GONRG-11684). Defaults to true because core-plus reaches Airflow over internal in-mesh http
# (transport secured by istio mTLS); Airflow 3 must not impose a stricter transport constraint than
# the ungated in-mesh Airflow 2 client. Set FEATURE_FLAG_ALLOW_HTTP_AIRFLOW=false to require https
# (e.g. when talking to an external Airflow over a public network).
featureFlag.allow.http.airflow=${FEATURE_FLAG_ALLOW_HTTP_AIRFLOW:true}
