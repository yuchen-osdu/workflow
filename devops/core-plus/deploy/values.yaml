global:
  domain: ""
  useHttps: true
  limitsEnabled: true
  dataPartitionId: ""

data:
  #Configmap variables
  logLevel: "ERROR"
  partitionHost: "http://partition"
  entitlementsHost: "http://entitlements"
  schemaHost: "http://schema"
  legalHost: "http://legal"
  osduAirflowUrl: "http://airflow:8080"
  # Airflow 3 engine toggle + side-by-side host (driven by the deployment flag,
  # e.g. CIMPL_AIRFLOW3). airflowVersion3Enabled=true -> OSDU_AIRFLOW_VERSION=airflow3.
  airflowVersion3Enabled: false
  osduAirflow3Url: ""
  # Airflow 3 api/v2 JWT token-exchange credentials are supplied via the workflow airflow
  # secret (workflowAirflowSecretName), injected by the Deployment's envFrom secretRef exactly
  # like the Airflow 2 credentials. The secret must include OSDU_AIRFLOW_AIRFLOW3_USERNAME and
  # OSDU_AIRFLOW_AIRFLOW3_PASSWORD keys when Airflow 3 is enabled.
  sharedTenantName: ""
  composerClient: "IAAP"
  workflowHost: "http://workflow"
  dagNames:
    - csv_ingestion
    - Osdu_ingest
    - Osdu_ingest_by_reference
    - eds_ingest
    - eds_naturalization
    - eds_scheduler
  # Deployment variables
  requestsCpu: "5m"
  requestsMemory: "650Mi"
  limitsCpu: "1"
  limitsMemory: "3G"
  serviceAccountName: "workflow"
  bootstrapImage: ""
  bootstrapServiceAccountName: ""
  image: ""
  imagePullPolicy: "IfNotPresent"

conf:
  configmap: "workflow-config"
  appName: "workflow"
  workflowKeycloakSecretName: "workflow-keycloak-secret"
  workflowAirflowSecretName: "workflow-airflow-secret"
  workflowPostgresSecretName: "workflow-postgres-secret"
  rabbitmqSecretName: "rabbitmq-secret"
  bootstrapSecretName: "datafier-secret"
  replicas: 1

istio:
  proxyCPU: "5m"
  proxyCPULimit: "200m"
  proxyMemory: "50Mi"
  proxyMemoryLimit: "256Mi"
  bootstrapProxyCPU: "5m"
  bootstrapProxyCPULimit: "50m"
